# 使用SigLIP 2 So400m Patch16 NaFlex视觉骨干网络的YOLO11-L目标检测器。
# 以siglip2-yolo11.yaml加载，传入freeze=1可只训练检测neck/head。

# 参数
nc: 80 # 类别数
scales:
  # [深度系数, 宽度系数, 最大通道数]
  l: [1.00, 1.00, 1024]

# SigLIP 2视觉骨干网络
backbone:
  # [来源, 重复次数, 模块, 参数]
  - [-1, 1, SigLIP2So400M, [True]] # 0-P4/16，patch size 16时最大支持800x800

# YOLO11-L P3/8-P5/32检测头
head:
  - [0, 1, nn.Upsample, [None, 2, "nearest"]] # 1-P3/8
  - [-1, 2, C3k2, [256, True]] # 2-P3/8

  - [0, 1, nn.Identity, []] # 3-P4/16
  - [-1, 2, C3k2, [512, True]] # 4-P4/16

  - [0, 1, Conv, [1024, 3, 2]] # 5-P5/32
  - [-1, 2, C3k2, [1024, True]] # 6-P5/32

  - [[2, 4, 6], 1, Detect, [nc]] # Detect(P3, P4, P5)

# 使用C-RADIOv4-SO400M/16视觉骨干网络的YOLO11-L目标检测器。
# 使用model=c-radio-v4-yolo11.yaml加载；传入freeze=1可冻结视觉backbone并启用确定性CPE缓存。

nc: 80
scales:
  # [深度系数, 宽度系数, 最大通道数]
  l: [1.00, 1.00, 1024]

backbone:
  # [来源, 重复次数, 模块, 参数]
  - [-1, 1, CRADIOv4, [so400m, True]] # 0-P4/16

head:
  - [0, 1, nn.Upsample, [None, 2, "nearest"]] # 1-P3/8
  - [-1, 2, C3k2, [256, True]] # 2-P3/8

  - [0, 1, nn.Identity, []] # 3-P4/16
  - [-1, 2, C3k2, [512, True]] # 4-P4/16

  - [0, 1, Conv, [1024, 3, 2]] # 5-P5/32
  - [-1, 2, C3k2, [1024, True]] # 6-P5/32

  - [[2, 4, 6], 1, Detect, [nc]] # Detect(P3, P4, P5)
